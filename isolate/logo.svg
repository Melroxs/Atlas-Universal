<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer ring gradient: bright cyan (top-left) → indigo → vivid purple (bottom-right) -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="0.7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Inner chevron gradient: cyan (left tip) → purple (right tip) -->
    <linearGradient id="chevronGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Subtle light-blue tint along the A's facets -->
    <linearGradient id="aFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f4ff"/>
    </linearGradient>
    <!-- Globe grid bounds -->
    <clipPath id="globeClip">
      <circle cx="256" cy="256" r="140"/>
    </clipPath>
  </defs>

  <!-- Solid black background -->
  <rect x="0" y="0" width="512" height="512" fill="#000000"/>

  <!-- Globe wireframe grid behind the letter (meridians + parallels) -->
  <g clip-path="url(#globeClip)" stroke="#312e81" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="140"/>
    <ellipse cx="256" cy="256" rx="100" ry="140"/>
    <ellipse cx="256" cy="256" rx="50" ry="140"/>
    <ellipse cx="256" cy="256" rx="140" ry="100"/>
    <ellipse cx="256" cy="256" rx="140" ry="50"/>
  </g>

  <!-- Outer compass ring: four gradient arcs between the cardinal pointers -->
  <g stroke="url(#ringGrad)" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M 464.9 278.0 A 210 210 0 0 1 278.0 464.9"/>
    <path d="M 234.0 464.9 A 210 210 0 0 1 47.1 278.0"/>
    <path d="M 47.1 234.0 A 210 210 0 0 1 234.0 47.1"/>
    <path d="M 278.0 47.1 A 210 210 0 0 1 464.9 234.0"/>
  </g>

  <!-- Compass pointers -->
  <polygon points="256,32 234,76 278,76" fill="#67e8f9"/>   <!-- top: light cyan -->
  <polygon points="482,256 436,234 436,278" fill="url(#ringGrad)"/> <!-- right: cyan→purple -->
  <polygon points="256,482 234,436 278,436" fill="#a855f7"/> <!-- bottom: purple -->
  <polygon points="30,256 76,234 76,278" fill="#22d3ee"/>   <!-- left: cyan -->

  <!-- Central stylized "A" with pointed apex and feet -->
  <path
    d="M 256 108 L 364 372 L 330 372 L 306 318 L 206 318 L 182 372 L 148 372 Z"
    fill="url(#aFill)"
  />
  <!-- Counter (open hole) of the A -->
  <path d="M 256 205 L 315 318 L 197 318 Z" fill="#000000"/>
  <!-- Inner gradient chevron / arrowhead pointing up -->
  <path
    d="M 226 360 L 256 324 L 286 360"
    stroke="url(#chevronGrad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
